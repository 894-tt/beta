<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fc">
  <meta name="description" content="時間割と持ち物・小テスト・宿題をまとめて管理するアプリ">
  <title>時間割ノート</title>
  <link rel="manifest" id="app-manifest">
  <style>
    :root {
      --page: #f5f6fc; --surface: #fff; --ink: #202124; --muted: #646a73;
      --line: #d8dbe4; --accent: #3976d8; --accent-soft: #dce7fb;
      --shadow: 0 6px 24px rgba(26, 34, 53, .14); --radius: 9px;
    }
    * { box-sizing: border-box; }
    html { background: #e8eaf0; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #80aaf3; outline-offset: 2px; }
    .app-shell { width: min(100%, 1040px); min-height: 100vh; margin: 0 auto; background: var(--page); box-shadow: 0 0 36px #20212418; position: relative; overflow: hidden; }
    .topbar { height: 68px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--page); position: sticky; top: 0; z-index: 5; border-bottom: 1px solid #e5e7ee; }
    .icon-button { width: 38px; height: 38px; border: 0; background: transparent; color: #50545c; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto; }
    .icon-button:hover { background: #e4e8f2; }
    .icon-button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .month-button { border: 0; background: transparent; padding: 8px 7px; font-size: 18px; font-weight: 600; color: #30333a; border-radius: 8px; white-space: nowrap; }
    .month-button:hover { background: #e8eaf3; }
    .topbar-spacer { flex: 1; }
    .day-number { border: 1px solid #7a7e87; border-radius: 5px; width: 24px; height: 24px; font-size: 12px; font-weight: 700; display: grid; place-items: center; background: transparent; }
    .avatar { background: #b9d0fa; color: #2e68bc; position: relative; }
    .avatar::after { content: "!"; position: absolute; right: -1px; bottom: -1px; font-size: 10px; line-height: 14px; width: 14px; height: 14px; border-radius: 50%; color: #493800; background: #ffca28; border: 1px solid var(--page); font-weight: 800; }
    .search-strip { padding: 8px 16px 12px; display: none; background: var(--page); }
    .search-strip.open { display: block; }
    .search-strip input { width: 100%; border: 1px solid var(--line); border-radius: 22px; padding: 10px 15px; background: white; }
    .content { padding: 0 18px 90px; }
    .day-heading { display: flex; align-items: center; gap: 12px; padding: 12px 4px 14px; }
    .date-day { color: #656b75; width: 36px; text-align: center; line-height: 1.15; font-size: 13px; }
    .date-day strong { display: block; font-size: 18px; color: #292c32; margin-top: 3px; }
    .heading-title { font-size: 14px; color: #7b808b; }
    .heading-date { font-size: 19px; font-weight: 650; margin-top: 1px; }
    .day-nav { margin-left: auto; display: flex; gap: 3px; }
    .timeline { display: grid; grid-template-columns: 54px minmax(0, 1fr); grid-auto-rows: minmax(54px, auto); gap: 3px 0; }
    .slot-label { font-size: 12px; color: #666d77; display: flex; justify-content: center; align-items: flex-start; padding-top: 5px; border-right: 1px solid #dfe2eb; margin-right: 8px; position: relative; }
    .slot-label small { position: absolute; top: 26px; font-size: 10px; color: #9297a1; }
    .slot-label.break-label { align-items: center; padding-top: 0; color: #747985; writing-mode: horizontal-tb; }
    .slot-label.break-label span { background: var(--page); padding: 4px 0; }
    .slot-label.after-label { align-items: end; padding-bottom: 4px; }
    .slot-cell { min-width: 0; align-self: stretch; border: 1px solid #d0d3dc; border-radius: 5px; background: rgba(255,255,255,.42); margin-bottom: 1px; }
    .slot-cell.blank { border-color: transparent; background: transparent; }
    .class-card { grid-column: 2; min-width: 0; min-height: 53px; margin-bottom: 1px; border: 1px solid #aeb3bd; border-radius: 5px; padding: 4px 9px 5px; text-align: left; color: #111827; display: flex; flex-direction: column; gap: 1px; overflow: hidden; transition: box-shadow .12s, transform .12s; }
    .class-card:hover { box-shadow: 0 2px 7px #263b5b24; transform: translateY(-1px); }
    .class-card .subject { font-weight: 750; font-size: 16px; line-height: 1.17; overflow-wrap: anywhere; }
    .class-card .detail-line { font-size: 12px; line-height: 1.22; overflow-wrap: anywhere; }
    .class-card .detail-line:empty { display: none; }
    .class-card .card-footer { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 11px; margin-top: 3px; color: #414854; }
    .class-card .warning-tag { color: #8b300b; font-weight: 750; }
    .class-card.has-alert { box-shadow: inset 4px 0 #eb8c26; }
    .class-card.color-pink { background: #ffe3e5; }
    .class-card.color-blue { background: #dceef9; }
    .class-card.color-purple { background: #ebe4fa; }
    .class-card.color-yellow { background: #fff0df; }
    .class-card.color-green { background: #e5f5df; }
    .class-card.color-gray { background: #f3f3f3; }
    .class-card.color-mint { background: #dff7ef; }
    .class-card.color-cyan { background: #dff6f7; }
    .break-cell { color: #777d86; font-size: 12px; display: flex; align-items: center; padding-left: 8px; border-bottom: 1px dashed #d7dae3; }
    .fab { position: fixed; z-index: 4; bottom: max(18px, env(safe-area-inset-bottom)); left: calc(50% + min(520px, 50vw) - 78px); width: 54px; height: 54px; border: 1px solid #aeb9c7; border-radius: 12px; background: #d7e7f7; box-shadow: 0 2px 7px #20212426; color: #18202b; font-size: 30px; font-weight: 300; display: grid; place-items: center; }
    .fab:hover { background: #c7dcf4; }
    .overlay { position: fixed; inset: 0; background: #1419226b; z-index: 20; display: none; align-items: center; justify-content: center; padding: 18px; }
    .overlay.open { display: flex; }
    .drawer-overlay { justify-content: flex-start; padding: 0; }
    .drawer { background: #f5f4fb; width: min(320px, 84vw); height: 100%; padding: 14px 9px 20px; transform: translateX(-103%); transition: transform .2s ease; box-shadow: var(--shadow); overflow-y: auto; }
    .drawer-overlay.open .drawer { transform: translateX(0); }
    .logo-area { height: 90px; margin: 0 4px 10px; background: #00e7ed; border: 1px solid #616a70; display: flex; align-items: center; justify-content: center; overflow: hidden; color: #111; font-size: 22px; }
    .logo-area img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .menu-item { width: 100%; text-align: left; border: 0; background: transparent; display: flex; align-items: center; gap: 14px; padding: 10px 13px; min-height: 40px; color: #4e535d; border-radius: 25px; font-size: 13px; }
    .menu-item svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .menu-item.active { background: #dce5fa; color: #26313f; }
    .menu-divider { height: 1px; background: #d6d8df; margin: 10px 0 4px; }
    .modal { width: min(720px, 100%); max-height: min(88vh, 920px); overflow: auto; background: #fff; border-radius: 16px; box-shadow: var(--shadow); }
    .modal.compact { width: min(500px, 100%); }
    .modal-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; background: #fff; border-bottom: 1px solid #eaecf1; }
    .modal-header h2 { font-size: 18px; margin: 0; }
    .modal-body { padding: 18px; }
    .modal-footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; padding: 14px 18px 18px; border-top: 1px solid #eaecf1; }
    .btn { border: 1px solid #c8ced8; border-radius: 9px; background: #fff; padding: 9px 14px; color: #273244; }
    .btn:hover { background: #f3f6fb; }
    .btn.primary { background: #356fd1; color: white; border-color: #356fd1; }
    .btn.danger { color: #a22e2e; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12px; color: #5c6470; font-weight: 650; }
    .field input, .field select, .field textarea { border: 1px solid #ccd1da; border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; background: white; color: #202124; }
    .field textarea { min-height: 68px; resize: vertical; }
    .field-help, .muted { font-size: 12px; color: #727986; line-height: 1.5; }
    .check-row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .color-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-dot { width: 30px; height: 30px; border: 2px solid #c0c5ce; border-radius: 50%; position: relative; }
    .color-dot[aria-pressed="true"] { outline: 2px solid #3473d2; outline-offset: 2px; border-color: white; }
    .color-dot.color-pink { background: #ffe3e5; }.color-dot.color-blue { background: #dceef9; }.color-dot.color-purple { background: #ebe4fa; }.color-dot.color-yellow { background: #fff0df; }.color-dot.color-green { background: #e5f5df; }.color-dot.color-gray { background: #f3f3f3; }.color-dot.color-mint { background: #dff7ef; }.color-dot.color-cyan { background: #dff6f7; }
    .toast { position: fixed; z-index: 40; bottom: 22px; left: 50%; transform: translate(-50%, 14px); background: #242a35; color: white; padding: 11px 16px; border-radius: 10px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100vw - 24px); font-size: 13px; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .notice-list { display: flex; flex-direction: column; gap: 8px; }
    .notice-item { background: #fff8e8; border: 1px solid #f0d6a3; border-radius: 9px; padding: 10px 12px; font-size: 13px; }
    .notice-item strong { display: block; margin-bottom: 4px; }
    .empty-state { border: 1px dashed #cbd1dc; border-radius: 12px; padding: 30px 18px; color: #747b86; text-align: center; margin: 12px 0; }
    .overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding-bottom: 18px; }
    .overview-day { background: #fff; border: 1px solid #d8dce6; border-radius: 11px; padding: 10px; min-width: 0; }
    .overview-day h3 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }
    .mini-class { border-radius: 6px; padding: 6px; margin: 5px 0; font-size: 12px; border: 1px solid #c4c8d2; overflow-wrap: anywhere; }
    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
    .month-cell { min-height: 74px; background: white; border: 1px solid #dfe3eb; border-radius: 7px; padding: 5px; text-align: left; color: #303642; }
    .month-cell.outside { opacity: .42; }.month-cell.selected { outline: 2px solid #3e78d4; background: #eef4ff; }
    .month-cell .date-n { font-size: 12px; font-weight: 700; }.month-cell .count { font-size: 10px; color: #6b7480; display: block; margin-top: 8px; }
    .import-preview { width: 100%; max-height: 240px; object-fit: contain; background: #eef0f5; border-radius: 8px; border: 1px solid #d8dce5; }
    .progress { height: 6px; background: #e8ebf2; border-radius: 99px; overflow: hidden; margin: 8px 0; }.progress > div { height: 100%; width: 0; background: #3976d8; transition: width .15s; }
    .editor-table-wrap { overflow: auto; border: 1px solid #dce0e8; border-radius: 8px; }
    .editor-table { border-collapse: collapse; width: 100%; min-width: 570px; font-size: 12px; }
    .editor-table th, .editor-table td { border-bottom: 1px solid #e6e9ef; padding: 7px; text-align: left; }
    .editor-table th { background: #f4f6fa; position: sticky; top: 0; }
    .editor-table input, .editor-table select { width: 100%; min-width: 75px; border: 1px solid #d0d5df; border-radius: 6px; padding: 7px; }
    .editor-table .remove-row { border: 0; background: transparent; color: #a33; font-size: 18px; }
    .editor-table { min-width: 1030px; }
    .editor-table td { vertical-align: top; }
    .editor-table input, .editor-table select { min-width: 92px; }
    .editor-table td:nth-child(4) input { min-width: 150px; }
    .editor-table td:nth-child(5) input, .editor-table td:nth-child(6) input { min-width: 135px; }
    .slot-stack { display: grid; gap: 4px; min-width: 104px; }
    .slot-stack .check-row { white-space: nowrap; font-size: 11px; }
    .slot-stack input[type=checkbox] { width: auto; min-width: 0; }
    .import-details { display: grid; gap: 5px; min-width: 230px; }
    .import-details label { display: grid; grid-template-columns: 58px minmax(130px, 1fr); align-items: center; gap: 5px; color: #5c6470; font-size: 11px; }
    .import-details input { min-width: 130px !important; }
    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .tiny-status { font-size: 11px; color: #737987; }
    @media (min-width: 800px) {
      .content { padding-left: clamp(22px, 5vw, 58px); padding-right: clamp(22px, 5vw, 58px); }
      .timeline { grid-template-columns: 70px minmax(0,1fr); }
      .class-card .subject { font-size: 17px; }
      .class-card .detail-line { font-size: 13px; }
    }
    @media (max-width: 600px) {
      .topbar { height: 60px; padding: 0 8px; gap: 3px; }
      .month-button { font-size: 16px; padding: 7px 4px; }
      .topbar .icon-button { width: 34px; height: 36px; }
      .content { padding: 0 9px 88px; }
      .timeline { grid-template-columns: 45px minmax(0,1fr); grid-auto-rows: minmax(53px, auto); }
      .slot-label { margin-right: 5px; font-size: 11px; }
      .class-card { padding: 4px 6px; }
      .class-card .subject { font-size: 15px; }
      .class-card .detail-line { font-size: 11px; }
      .fab { left: auto; right: 18px; }
      .overlay { padding: 8px; }
      .modal { max-height: 94vh; border-radius: 12px; }
      .modal-body { padding: 13px; }
      .form-grid { grid-template-columns: minmax(0,1fr); }
      .field.full { grid-column: auto; }
      .overview-grid { grid-template-columns: 1fr; }
      .overview-day { padding: 9px; }
      .month-cell { min-height: 57px; padding: 3px; }
      .month-cell .count { font-size: 9px; margin-top: 4px; }
    }
  </style>
</head>
<body>
<div class="app-shell" id="app">
  <header class="topbar" aria-label="メインナビゲーション">
    <button class="icon-button" id="menuBtn" aria-label="メニューを開く" title="メニュー">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="month-button" id="monthBtn" title="日付を選択">10月 <span aria-hidden="true">⌄</span></button>
    <div class="topbar-spacer"></div>
    <button class="icon-button" id="searchBtn" aria-label="検索" title="検索"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.3 4.3"/></svg></button>
    <button class="icon-button" id="todayBtn" aria-label="今日" title="今日"><span class="day-number" id="todayNumber">29</span></button>
    <button class="icon-button" id="alertsBtn" aria-label="忘れ物・備考の確認" title="忘れ物・備考"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></svg></button>
    <button class="icon-button avatar" id="settingsBtn" aria-label="設定" title="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20c.4-4 2.5-6 6.5-6s6.1 2 6.5 6"/></svg></button>
  </header>
  <div class="search-strip" id="searchStrip"><input id="searchInput" type="search" placeholder="教科・持ち物・宿題を検索…" aria-label="時間割を検索"></div>
  <main class="content">
    <div class="day-heading">
      <div class="date-day"><span id="weekdayShort">木</span><strong id="dateNumber">29</strong></div>
      <div><div class="heading-title" id="headingTitle">時間割</div><div class="heading-date" id="headingDate">2026年10月29日（木）</div></div>
      <div class="day-nav">
        <button class="icon-button" id="prevDay" aria-label="前の日">‹</button>
        <button class="icon-button" id="nextDay" aria-label="次の日">›</button>
      </div>
    </div>
    <section id="viewRoot" aria-live="polite"></section>
  </main>
  <button class="fab" id="addBtn" aria-label="授業を追加" title="授業を追加">+</button>
</div>

<div class="overlay drawer-overlay" id="drawerOverlay" aria-hidden="true">
  <nav class="drawer" aria-label="メニュー">
    <div class="logo-area" id="logoArea"><span>ロゴ画像</span><img id="logoImage" alt="ロゴ画像" hidden></div>
    <button class="menu-item" data-view="schedule"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="5" rx="1"/><rect x="4" y="14" width="16" height="5" rx="1"/></svg>スケジュール</button>
    <button class="menu-item active" data-view="day"><svg viewBox="0 0 24 24"><path d="M4 5h16v4H4zM4 11h16v8H4z" fill="currentColor" stroke="none"/></svg>日</button>
    <button class="menu-item" data-view="3days"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="5" height="14"/><rect x="9.5" y="5" width="5" height="14"/><rect x="16" y="5" width="5" height="14"/></svg>3日間</button>
    <button class="menu-item" data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 10h18M7.5 5v14M12 5v14M16.5 5v14"/></svg>週</button>
    <button class="menu-item" data-view="month"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>月</button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="loadTimetableBtn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M8 4 9.5 2h5L16 4"/></svg>時間割読み込み</button>
    <button class="menu-item" id="drawerSettingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19 13.5 1.4 1.1-1.5 2.6-1.7-.6a7.6 7.6 0 0 1-1.7 1l-.3 1.8h-3l-.4-1.8a7.6 7.6 0 0 1-1.7-1l-1.7.6-1.5-2.6 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.6a7.6 7.6 0 0 1 1.7-1l.4-1.8h3l.3 1.8a7.6 7.6 0 0 1 1.7 1l1.7-.6 1.5 2.6-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1)"/></svg>設定</button>
    <div class="menu-divider"></div>
    <div class="tiny-status" style="padding:8px 14px">データはこのブラウザに自動保存されます。</div>
  </nav>
</div>

<div class="overlay" id="modalOverlay" aria-hidden="true"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
<input type="file" id="imageInput" accept="image/*" capture="environment" hidden>
<input type="file" id="jsonInput" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
// ロゴを変更する場合は、このURLを利用する画像に差し替えてください。
const LOGO_IMAGE_URL = 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYi08lrW1F_vJCSNXjcAjQZ6AIGwnOcwm-3VVA5r2LOg&s=10';
const STORAGE_KEY = 'timetable-note-v1';
// GitHub Pagesから呼び出すCloudflare WorkerのURLに置き換えてください。末尾の /api/timetable まで必要です。
const GEMINI_PROXY_URL = 'https://timetable-gem-api.timetableapp-info.workers.dev/api/timetable';
const DEFAULT_GEMINI_MODEL = 'gemini-3.8-flash';
const GEMINI_MODELS = [
  {value:'gemini-3.8-flash', label:'Gemini 3.8 Flash（精度重視・無料枠あり）'},
  {value:'gemini-3.5-flash-lite', label:'Gemini 3.5 Flash-Lite（軽量・無料枠あり）'}
];
// APIキーはCloudflare WorkerのSecret `gem_api` に置き、ブラウザには持たせません。
let geminiModel = DEFAULT_GEMINI_MODEL;
let ocrRunToken = 0;
const DAYS = ['日','月','火','水','木','金','土'];
const SLOTS = ['朝','1','2','3','4','昼休み','5','6','7','放課後'];
const PERIOD_SLOTS = ['朝','1','2','3','4','昼休み','5','6','7','放課後'];
const COLORS = ['pink','blue','purple','yellow','green','gray','mint','cyan'];
const COLOR_NAMES = {pink:'ピンク',blue:'青',purple:'紫',yellow:'黄',green:'緑',gray:'グレー',mint:'ミント',cyan:'水色'};
const SLOT_INDEX = Object.fromEntries(SLOTS.map((s,i)=>[s,i]));
const $ = (selector, root=document) => root.querySelector(selector);
const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
const makeId = () => (crypto?.randomUUID ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`);
const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const clone = value => JSON.parse(JSON.stringify(value));

function seedEvents() {

  const rawBlock=mode==='tesseract'?`<div class="field" style="margin:12px 0"><label for="ocrRawText">OCRの生テキスト（必要に応じて修正）</label><textarea id="ocrRawText" rows="5" placeholder="認識された文字がここに表示されます">${escapeHtml(ocrText)}</textarea><div style="display:flex;justify-content:flex-end;margin-top:5px"><button class="btn" id="rebuildRows">テキストから行を作り直す</button></div></div>`:`<p class="muted">Geminiが画像全体の表構造を解析しました。信頼度の低い行、曜日、結合セルは必ず確認してください。</p>${notesBlock}`;
  const body=`<p class="muted">${slotHelp}</p>${preview?`<img class="import-preview" src="${preview}" alt="元画像">`:''}${rawBlock}<div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px"><strong>時間割エディタ</strong><span id="importRowCount" class="muted"></span></div><div class="editor-table-wrap"><table class="editor-table"><thead><tr><th>#</th><th>曜日</th><th>開始・終了コマ</th><th>教科名・予定</th><th>持ち物</th><th>宿題</th><th>小テスト・場所・備考・忘れ物</th><th></th></tr></thead><tbody id="importRowsBody"></tbody></table></div><div style="margin-top:10px"><button class="btn" id="addImportRow">＋ 行を追加</button></div>`;
  openModal('OCR認識結果を編集',body,`<button class="btn" data-close-modal>キャンセル</button><button class="btn primary" id="saveImportedRows">確認した内容を登録</button>`);
  renderImportTable();
  if($('#rebuildRows'))$('#rebuildRows').addEventListener('click',()=>{importRows=guessImportRows($('#ocrRawText').value);renderImportTable();toast('OCRテキストから行を作り直しました');});
  $('#addImportRow').addEventListener('click',()=>{importRows.push({weekday:selectedDateObj().getDay(),slot:'1',endSlot:'1',subject:'',items:'',quiz:'',location:'',homework:'',notes:'',forgotten:'',allDay:false,colSpan:1});renderImportTable();});
  $('#saveImportedRows').addEventListener('click',()=>{
    const valid=importRows.map(normalizeImportRow).filter(r=>String(r.subject||'').trim()||r.items||r.quiz||r.location||r.homework||r.notes||r.forgotten);
    if(!valid.length){toast('登録する教科名や内容がありません');return;}
    valid.forEach(r=>{
      let slot=SLOTS.includes(r.slot)?r.slot:'1'; let endSlot=SLOTS.includes(r.endSlot)?r.endSlot:slot; const allDay=Boolean(r.allDay);
      if(allDay){slot='朝';endSlot='放課後';}
      if((SLOT_INDEX[endSlot]??0)<(SLOT_INDEX[slot]??0))endSlot=slot;
      state.events.push({id:makeId(),weekday:Number(r.weekday),dateKey:null,slot,endSlot,subject:String(r.subject||'（予定）').trim(),color:COLORS.includes(r.color)?r.color:COLORS[(SLOT_INDEX[slot]||0)%COLORS.length],items:r.items||'',quiz:r.quiz||'',location:r.location||'',homework:r.homework||'',notes:r.notes||'',forgotten:r.forgotten||'',allDay,colSpan:Math.max(1,Math.min(7,Number(r.colSpan)||1)),rowSpan:Math.max(1,(SLOT_INDEX[endSlot]??0)-(SLOT_INDEX[slot]??0)+1)});
    });
    closeModal();state.view='day';persist();render();toast(`${valid.length}件を時間割に登録しました`);
  });
}
// PWA manifest is generated inline. Service Worker must still be delivered as a same-origin JS file by the host.
const manifest = {name:'時間割ノート',short_name:'時間割',start_url:'.',display:'standalone',background_color:'#f5f6fc',theme_color:'#f5f6fc',description:'時間割と宿題・持ち物の管理'};
$('#app-manifest').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest));
const SERVICE_WORKER_SOURCE = `self.addEventListener('install',event=>event.waitUntil(caches.open('timetable-shell-v1').then(cache=>cache.addAll(['./']))));self.addEventListener('fetch',event=>{event.respondWith(caches.match(event.request).then(cached=>cached||fetch(event.request).then(response=>{const copy=response.clone();caches.open('timetable-shell-v1').then(cache=>cache.put(event.request,copy));return response}).catch(()=>caches.match('./'))))});`;
// file:// では登録不可。HTTP(S)で service-worker.js を同じフォルダから配信した場合に自動登録します。
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
  navigator.serviceWorker.register('./service-worker.js').catch(err => console.info('PWAキャッシュは未設定です。単一HTMLとしての通常利用は可能です。', err));
}

loadSavedState(); applyLogo(); render();
$('#menuBtn').addEventListener('click',openDrawer);
$('#drawerOverlay').addEventListener('click',e=>{if(e.target===$('#drawerOverlay'))closeDrawer();});
$('#monthBtn').addEventListener('click',openDatePicker);
$('#todayBtn').addEventListener('click',()=>{state.selectedDate=dateKey(new Date());render();});
$('#prevDay').addEventListener('click',()=>{const d=selectedDateObj();d.setDate(d.getDate()-1);state.selectedDate=dateKey(d);render();});
$('#nextDay').addEventListener('click',()=>{const d=selectedDateObj();d.setDate(d.getDate()+1);state.selectedDate=dateKey(d);render();});
$('#addBtn').addEventListener('click',()=>openEventEditor());
$('#searchBtn').addEventListener('click',()=>{$('#searchStrip').classList.toggle('open');if($('#searchStrip').classList.contains('open'))$('#searchInput').focus();else {$('#searchInput').value='';render();}});
$('#searchInput').addEventListener('input',()=>{
  const q=$('#searchInput').value.trim().toLocaleLowerCase(); if(!q){render();return;}
  const matches=sameDayEvents(selectedDateObj()).filter(e=>eventText(e).toLocaleLowerCase().includes(q));
  $('#headingTitle').textContent=`検索結果：${matches.length}件`;
  $('#viewRoot').innerHTML=matches.length?`<div style="display:grid;gap:6px">${matches.map(e=>eventCardHTML(e,true)).join('')}</div>`:'<div class="empty-state">一致する時間割がありません。</div>';
});
$('#alertsBtn').addEventListener('click',openAlerts);$('#settingsBtn').addEventListener('click',openSettings);$('#drawerSettingsBtn').addEventListener('click',()=>{closeDrawer();openSettings();});$('#loadTimetableBtn').addEventListener('click',openImportChooser);
$$('.menu-item[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;closeDrawer();render();}));
$('#viewRoot').addEventListener('click',e=>{const card=e.target.closest('[data-event-id]');if(card){openEventEditor(card.dataset.eventId);return;}const pick=e.target.closest('[data-pick-date]');if(pick){state.selectedDate=pick.dataset.pickDate;state.view='day';render();}});
$('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal();});
document.addEventListener('click',e=>{if(e.target.closest('[data-close-modal]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();}});
$('#imageInput').addEventListener('change',e=>{const file=e.target.files?.[0]; e.target.value=''; if(file)handleImageSelected(file);});
$('#jsonInput').addEventListener('change',e=>{const file=e.target.files?.[0];e.target.value='';if(file)importJsonFile(file);});
checkShareUrl();
</script>
</body>
